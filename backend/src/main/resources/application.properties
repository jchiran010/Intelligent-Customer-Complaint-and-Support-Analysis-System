# ====================================================================
# INTELLIGENT CUSTOMER COMPLAINT & SUPPORT ANALYSIS SYSTEM
# APPLICATION CONFIGURATION
# ====================================================================

spring.application.name=complaint-system-backend
server.port=${PORT:8080}
server.servlet.context-path=/

# Primary Database: MySQL (with cloud environment variable overrides & automatic H2 fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${MYSQL_URL:jdbc:mysql://localhost:3306/complaint_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${MYSQL_USER:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:root}}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# Active Profile (defaults to standard, can be set to h2 for pure in-memory)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# Logging
logging.level.com.complaintsystem=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
