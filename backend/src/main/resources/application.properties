# ====================================================================
# INTELLIGENT CUSTOMER COMPLAINT & SUPPORT ANALYSIS SYSTEM
# APPLICATION CONFIGURATION
# ====================================================================

spring.application.name=complaint-system-backend
server.port=8080
server.servlet.context-path=/

# Primary Database: MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/complaint_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# Logging
logging.level.com.complaintsystem=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
