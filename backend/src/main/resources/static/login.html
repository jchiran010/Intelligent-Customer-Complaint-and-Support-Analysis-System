<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Intelligent Support System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/unified.css">
  <link rel="stylesheet" href="/css/unified-responsive.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at 50% 10%, rgba(13, 148, 136, 0.08) 0%, rgba(79, 70, 229, 0.05) 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 450px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      padding: 2.25rem 2rem;
      position: relative;
    }
    .role-tabs {
      background: var(--bg-surface-alt);
      border-radius: 9999px;
      padding: 4px;
      display: flex;
      border: 1px solid var(--border-color);
      margin-bottom: 1.75rem;
    }
    .role-tab-btn {
      flex: 1;
      padding: 0.5rem;
      border-radius: 9999px;
      border: 0;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      cursor: pointer;
      transition: var(--transition);
    }
    .role-tab-btn.active {
      background: var(--bg-surface);
      color: var(--primary-color);
      box-shadow: var(--shadow-sm);
    }
    .role-tab-btn.active.admin-tab {
      color: var(--admin-accent);
    }
  </style>
</head>
<body>

  <!-- Page Transition Bar & Overlay -->
  <div class="page-transition-bar" id="pageTransitionBar"></div>
  <div class="page-transition-overlay" id="pageTransitionOverlay">
    <div class="page-transition-spinner mb-3"></div>
    <div class="small fw-bold text-muted animate-pulse-glow">Loading Secure Portal...</div>
  </div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <!-- Theme Switcher Top Right -->
      <div class="position-absolute top-0 end-0 p-3">
        <button class="btn btn-sm btn-outline-secondary border-0" id="themeToggleBtn" title="Toggle Theme">
          <i class="bi bi-moon-stars theme-toggle-icon fs-5"></i>
        </button>
      </div>

      <div class="text-center mb-3">
        <a href="/" class="text-decoration-none">
          <h4 class="fw-bold text-primary mb-1"><i class="bi bi-shield-check me-1"></i> SupportDesk</h4>
        </a>
        <p class="text-muted small">Intelligent Customer Complaint & Support Analysis System</p>
      </div>

      <!-- Segmented Role Selector Switch -->
      <div class="role-tabs">
        <button type="button" class="role-tab-btn active" id="tabCustomerBtn" onclick="selectAuthTab('customer')">
          <i class="bi bi-person me-1"></i> Customer Login
        </button>
        <button type="button" class="role-tab-btn" id="tabAdminBtn" onclick="selectAuthTab('admin')">
          <i class="bi bi-shield-lock me-1"></i> Admin Login
        </button>
        <button type="button" class="role-tab-btn" id="tabRegisterBtn" onclick="selectAuthTab('register')">
          <i class="bi bi-person-plus me-1"></i> Create Account
        </button>
      </div>

      <!-- Alert Box -->
      <div id="unifiedAlert" class="alert alert-danger d-none" role="alert"></div>

      <!-- Tab 1: Customer Form -->
      <div id="customerFormContainer">
        <form id="unifiedCustomerForm">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Customer Email</label>
            <div class="input-group">
              <span class="input-group-text bg-surface-alt border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control border-start-0" id="custEmail" value="john.doe@example.com" placeholder="name@domain.com" required>
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <label class="form-label small fw-semibold">Password</label>
              <a href="/user/forgot-password.html" class="small text-decoration-none text-primary">Forgot?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-surface-alt border-end-0 text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control border-start-0 border-end-0" id="custPassword" value="User@123" placeholder="••••••••" required>
              <button class="btn btn-outline-secondary border-start-0 bg-surface-alt" type="button" onclick="togglePasswordVisibility('custPassword', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="custSubmitBtn">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In as Customer
          </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
          <span class="text-muted small">New to SupportDesk?</span>
          <button type="button" onclick="selectAuthTab('register')" class="btn btn-link p-0 small fw-semibold text-decoration-none ms-1">
            Create Customer Account &rarr;
          </button>
        </div>
      </div>

      <!-- Tab 2: Admin Form -->
      <div id="adminFormContainer" class="d-none">
        <form id="unifiedAdminForm">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Administrator Email</label>
            <div class="input-group">
              <span class="input-group-text bg-surface-alt border-end-0 text-muted"><i class="bi bi-envelope-at"></i></span>
              <input type="email" class="form-control border-start-0" id="admEmail" value="admin@complaintsystem.com" placeholder="admin@domain.com" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Master Password</label>
            <div class="input-group">
              <span class="input-group-text bg-surface-alt border-end-0 text-muted"><i class="bi bi-key"></i></span>
              <input type="password" class="form-control border-start-0 border-end-0" id="admPassword" value="Admin@123" placeholder="••••••••" required>
              <button class="btn btn-outline-secondary border-start-0 bg-surface-alt" type="button" onclick="togglePasswordVisibility('admPassword', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn text-white w-100 py-2 fw-semibold" style="background-color: #4f46e5;" id="admSubmitBtn">
            <i class="bi bi-shield-check me-1"></i> Sign In as Administrator
          </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center text-muted small">
          <i class="bi bi-shield-lock-fill text-primary me-1"></i> Dedicated Administrator Portal Session
        </div>
      </div>

      <!-- Tab 3: Create New Account Form -->
      <div id="registerFormContainer" class="d-none">
        <form id="unifiedRegisterForm">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Full Name <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-surface-alt border-end-0 text-muted"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control border-start-0" id="regName" placeholder="e.g. Alex Johnson" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Email Address <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-surface-alt border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control border-start-0" id="regEmail" placeholder="name@domain.com" required>
            </div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-sm-6">
              <label class="form-label small fw-semibold">Phone Number</label>
              <div class="input-group">
                <span class="input-group-text bg-surface-alt border-end-0 text-muted"><i class="bi bi-telephone"></i></span>
                <input type="tel" class="form-control border-start-0" id="regPhone" placeholder="+1 (555) 000-0000">
              </div>
            </div>
            <div class="col-sm-6">
              <label class="form-label small fw-semibold">Account Tier</label>
              <select class="form-select" id="regDepartment">
                <option value="Customer">Standard Consumer</option>
                <option value="Premium Client">Premium Client</option>
                <option value="Business Customer">Business Account</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Create Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-surface-alt border-end-0 text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control border-start-0 border-end-0" id="regPassword" placeholder="Minimum 6 characters" required minlength="6">
              <button class="btn btn-outline-secondary border-start-0 bg-surface-alt" type="button" onclick="togglePasswordVisibility('regPassword', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="progress mt-1" style="height: 4px;">
              <div id="regPassStrengthBar" class="progress-bar bg-danger" style="width: 0%; transition: width 0.3s;"></div>
            </div>
            <div class="d-flex justify-content-between mt-1">
              <small class="text-muted" style="font-size: 0.72rem;" id="regPassStrengthText">Strength: none</small>
              <small class="text-muted" style="font-size: 0.72rem;">Min 6 chars</small>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Confirm Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-surface-alt border-end-0 text-muted"><i class="bi bi-shield-lock"></i></span>
              <input type="password" class="form-control border-start-0 border-end-0" id="regConfirmPassword" placeholder="Re-enter password" required minlength="6">
              <button class="btn btn-outline-secondary border-start-0 bg-surface-alt" type="button" onclick="togglePasswordVisibility('regConfirmPassword', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="regSubmitBtn">
            <i class="bi bi-person-check-fill me-1"></i> Register & Create Account
          </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
          <span class="text-muted small">Already have an account?</span>
          <button type="button" onclick="selectAuthTab('customer')" class="btn btn-link p-0 small fw-semibold text-decoration-none ms-1">
            Sign In as Customer &rarr;
          </button>
        </div>
      </div>

      <!-- Quick Demo Account Fillers -->
      <div class="mt-3 p-2 rounded bg-light border text-center small text-muted" style="font-size: 0.76rem;">
        <span id="demoHintText">Demo Customer: <code>john.doe@example.com</code> | <code>User@123</code></span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/unified-auth.js"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        if (icon) {
          icon.classList.remove('bi-eye');
          icon.classList.add('bi-eye-slash');
        }
      } else {
        input.type = 'password';
        if (icon) {
          icon.classList.remove('bi-eye-slash');
          icon.classList.add('bi-eye');
        }
      }
    }

    function selectAuthTab(role) {
      const btnCust = document.getElementById('tabCustomerBtn');
      const btnAdm = document.getElementById('tabAdminBtn');
      const btnReg = document.getElementById('tabRegisterBtn');
      const formCust = document.getElementById('customerFormContainer');
      const formAdm = document.getElementById('adminFormContainer');
      const formReg = document.getElementById('registerFormContainer');
      const hint = document.getElementById('demoHintText');

      // Reset active classes
      btnCust.className = 'role-tab-btn';
      btnAdm.className = 'role-tab-btn';
      if (btnReg) btnReg.className = 'role-tab-btn';
      formCust.classList.add('d-none');
      formAdm.classList.add('d-none');
      if (formReg) formReg.classList.add('d-none');

      if (role === 'customer') {
        btnCust.className = 'role-tab-btn active';
        formCust.classList.remove('d-none');
        hint.innerHTML = 'Demo Customer: <code>john.doe@example.com</code> | <code>User@123</code>';
      } else if (role === 'admin') {
        btnAdm.className = 'role-tab-btn active admin-tab';
        formAdm.classList.remove('d-none');
        hint.innerHTML = 'Demo Admin: <code>admin@complaintsystem.com</code> | <code>Admin@123</code>';
      } else if (role === 'register') {
        if (btnReg) btnReg.className = 'role-tab-btn active register-tab';
        if (formReg) formReg.classList.remove('d-none');
        hint.innerHTML = '<i class="bi bi-info-circle me-1"></i> Fill in your details above to create a new customer account immediately.';
      }
    }

    function applyLoginTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-bs-theme', theme);
      const icon = document.querySelector('.theme-toggle-icon');
      if (icon) {
        if (theme === 'dark') {
          icon.classList.remove('bi-moon-stars');
          icon.classList.add('bi-sun');
        } else {
          icon.classList.remove('bi-sun');
          icon.classList.add('bi-moon-stars');
        }
      }
    }

    const themeBtn = document.getElementById('themeToggleBtn');
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        applyLoginTheme(next);
        localStorage.setItem('app_theme', next);
      });
      const saved = localStorage.getItem('app_theme') || 'light';
      applyLoginTheme(saved);
    }

    // Page Transition Interceptor
    function initPageTransitions() {
      const bar = document.getElementById('pageTransitionBar');
      const overlay = document.getElementById('pageTransitionOverlay');

      if (overlay) overlay.classList.remove('active');
      if (bar) bar.classList.remove('loading');

      document.querySelectorAll('a[href]').forEach(link => {
        const href = link.getAttribute('href');
        if (
          href &&
          !href.startsWith('#') &&
          !href.startsWith('javascript:') &&
          !href.startsWith('mailto:') &&
          !href.startsWith('tel:') &&
          !link.hasAttribute('target') &&
          link.getAttribute('target') !== '_blank'
        ) {
          link.addEventListener('click', (e) => {
            if (e.metaKey || e.ctrlKey || e.shiftKey) return;
            e.preventDefault();
            if (bar) bar.classList.add('loading');
            if (overlay) overlay.classList.add('active');
            setTimeout(() => {
              window.location.href = href;
            }, 280);
          });
        }
      });
    }

    window.addEventListener('pageshow', () => {
      const bar = document.getElementById('pageTransitionBar');
      const overlay = document.getElementById('pageTransitionOverlay');
      if (overlay) overlay.classList.remove('active');
      if (bar) bar.classList.remove('loading');
    });

    initPageTransitions();
  </script>
</body>
</html>
