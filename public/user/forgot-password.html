<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Customer Support</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/user/css/user.css">
  <link rel="stylesheet" href="/user/css/user-responsive.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="bento-card" style="width: 100%; max-width: 420px;">
    <div class="text-center mb-4">
      <div class="stat-icon primary mx-auto mb-3"><i class="bi bi-key"></i></div>
      <h4 class="fw-bold mb-1">Forgot Password?</h4>
      <p class="text-muted small">Enter your email and we'll verify your support account</p>
    </div>

    <form onsubmit="event.preventDefault(); alert('Password reset link sent to your registered email address (Demo). Use User@123 to log in.'); window.location.href='/login.html';">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email Address</label>
        <input type="email" class="form-control" placeholder="name@domain.com" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Send Reset Link</button>
    </form>

    <div class="mt-4 pt-3 border-top text-center">
      <a href="/login.html" class="small fw-semibold text-decoration-none">&larr; Back to Login</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/user/js/user-common.js"></script>
</body>
</html>
