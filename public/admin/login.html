<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Intelligent Customer Complaint System</title>
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="stylesheet" href="/admin/css/admin-responsive.css">
  <style>
    .admin-login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.08) 0%, rgba(15, 23, 42, 0.02) 90%);
      padding: 1.5rem;
    }
    .admin-login-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      padding: 2.5rem 2.25rem;
      position: relative;
    }
    .admin-header-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(79, 70, 229, 0.1);
      color: var(--primary-color);
      border: 1px solid rgba(79, 70, 229, 0.2);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }
  </style>
</head>
<body>

  <div class="admin-login-wrapper">
    <div class="admin-login-card">
      <!-- Theme Switcher Top Right -->
      <div class="position-absolute top-0 end-0 p-3">
        <button class="btn btn-sm btn-outline-secondary border-0" id="themeToggleBtn" title="Toggle Dark/Light Mode">
          <i class="bi bi-moon-stars theme-toggle-icon fs-5"></i>
        </button>
      </div>

      <div class="text-center mb-4">
        <div class="admin-header-pill">
          <i class="bi bi-shield-lock-fill"></i> ADMIN PORTAL
        </div>
        <h3 class="fw-bold mb-1">Administrative Login</h3>
        <p class="text-muted small">Intelligent Customer Complaint & Support Analysis System</p>
      </div>

      <!-- Alert Message Box -->
      <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

      <!-- Admin Login Form -->
      <form id="adminLoginForm">
        <div class="mb-3">
          <label for="adminEmail" class="form-label fw-semibold small">Administrator Email</label>
          <div class="input-group">
            <span class="input-group-text bg-surface-alt border-end-0 text-muted"><i class="bi bi-envelope-at"></i></span>
            <input type="email" class="form-control border-start-0" id="adminEmail" value="admin@complaintsystem.com" placeholder="admin@domain.com" required>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center">
            <label for="adminPassword" class="form-label fw-semibold small">Master Password</label>
            <a href="#" class="small text-decoration-none text-primary fw-medium" onclick="alert('Demo Administrator credentials:\nEmail: admin@complaintsystem.com\nPassword: Admin@123'); return false;">Forgot?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-surface-alt border-end-0 text-muted"><i class="bi bi-key"></i></span>
            <input type="password" class="form-control border-start-0" id="adminPassword" value="Admin@123" placeholder="••••••••" required>
          </div>
        </div>

        <div class="mb-4 form-check">
          <input type="checkbox" class="form-check-input" id="adminRememberMe">
          <label class="form-check-label small text-muted" for="adminRememberMe">Remember administrator session</label>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="loginSubmitBtn">
          <span id="btnSpinner" class="spinner-border spinner-border-sm d-none me-2"></span>
          <span id="btnText">Sign In as Administrator</span>
        </button>
      </form>

      <div class="mt-4 pt-3 border-top text-center">
        <span class="text-muted small">Are you a customer?</span>
        <a href="/user/login.html" class="small fw-semibold text-decoration-none ms-1">Go to Customer Portal &rarr;</a>
      </div>

      <!-- Demo Info Card -->
      <div class="mt-3 p-2 rounded bg-light border text-center small text-muted" style="font-size: 0.76rem;">
        <i class="bi bi-info-circle me-1"></i> Demo Admin: <code>admin@complaintsystem.com</code> | <code>Admin@123</code>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/admin/js/admin-common.js"></script>
  <script src="/admin/js/admin-login.js"></script>
</body>
</html>
