<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for gradients -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Glow -->
  <circle cx="250" cy="250" r="220" fill="url(#glowGrad)" />

  <!-- Outer Shield Path -->
  <path d="M 250,50 
           C 370,50 420,90 420,190 
           C 420,310 330,390 250,440 
           C 170,390 80,310 80,190 
           C 80,90 130,50 250,50 Z" 
        fill="url(#shieldGrad)" 
        stroke="#2563EB" 
        stroke-width="8" 
        filter="url(#dropShadow)"/>

  <!-- Inner Shield Trim (Subtle Accent) -->
  <path d="M 250,75 
           C 340,75 385,105 385,185 
           C 385,280 315,350 250,395 
           C 185,350 115,280 115,185 
           C 115,105 160,75 250,75 Z" 
        fill="none" 
        stroke="#1E40AF" 
        stroke-width="3" 
        stroke-dasharray="8 6" />

  <!-- Chat Bubble Grid (Intelligent Support Concept) -->
  <g transform="translate(160, 140)">
    <!-- Main Chat bubble -->
    <path d="M 20,0 
             H 160 
             C 171,0 180,9 180,20 
             V 110 
             C 180,121 171,130 160,130 
             H 60 
             L 20,165 
             V 130 
             C 9,130 0,121 0,110 
             V 20 
             C 0,9 9,0 20,0 Z" 
          fill="url(#accentGrad)" 
          filter="drop-shadow(0px 8px 12px rgba(37, 99, 235, 0.3))"/>
          
    <!-- Intelligent Data Nodes (Connected circles inside bubble) -->
    <line x1="45" y1="45" x2="90" y2="45" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="90" y1="45" x2="135" y2="75" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="45" y1="85" x2="105" y2="85" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    
    <circle cx="45" cy="45" r="8" fill="#0F172A" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="90" cy="45" r="8" fill="#0F172A" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="135" cy="75" r="8" fill="#0F172A" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="45" cy="85" r="8" fill="#0F172A" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="105" cy="85" r="8" fill="#0F172A" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Big Checkmark overlay for Security and Resolution -->
  <path d="M 210,310 L 250,350 L 340,240" 
        fill="none" 
        stroke="#10B981" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="drop-shadow(0px 6px 8px rgba(16, 185, 129, 0.4))"/>

  <!-- Analytics bars inside checkmark region (Subtle check shadow) -->
  <g transform="translate(130, 240)" opacity="0.8">
    <rect x="0" y="30" width="8" height="20" rx="4" fill="#60A5FA"/>
    <rect x="16" y="10" width="8" height="40" rx="4" fill="#60A5FA"/>
    <rect x="32" y="20" width="8" height="30" rx="4" fill="#60A5FA"/>
  </g>
</svg>
