{% extends "common/base.html" %}
{% block guest_content %}
<div id="splash-overlay" style="background-color: #0b0f19; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden;">
  <!-- Abstract Digital Particles/Grid Background -->
  <div class="digital-grid"></div>
  
  <div class="text-center px-4" style="max-width: 650px; z-index: 5;">
    <!-- Large Animated Project Logo -->
    <div class="mb-4 animate-logo" style="width: 200px; height: 200px; margin: 0 auto; filter: drop-shadow(0 10px 30px rgba(37,99,235,0.4));">
      <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="System Logo" width="100%" height="100%">
    </div>
    
    <!-- Title -->
    <h1 class="text-white fw-bold mb-2 fs-2 animate-text tracking-in">Intelligent Customer Complaint</h1>
    <h3 class="text-primary fw-semibold mb-4 fs-4 animate-text tracking-in" style="letter-spacing: 2px;">&amp; Support Analysis System</h3>
    
    <!-- Loading Flow Spinner -->
    <div class="d-flex flex-column align-items-center mt-5">
      <div class="spinner-custom mb-3"></div>
      <span class="text-muted-custom fs-6 font-monospace" style="letter-spacing: 3px; font-size: 0.8rem;">INITIALIZING SECURE SAAS MATRIX</span>
    </div>
  </div>
</div>

<style>
  /* Digital Grid Background Simulation */
  .digital-grid {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
      linear-gradient(rgba(37, 99, 235, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(37, 99, 235, 0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: center;
    perspective: 500px;
    transform: rotateX(60deg) translateY(-30%);
    animation: gridFlow 15s linear infinite;
    opacity: 0.5;
  }

  @keyframes gridFlow {
    from { background-position: 0 0; }
    to { background-position: 0 400px; }
  }

  /* Animated logo rotation and glow */
  .animate-logo {
    animation: pulseGlow 2.5s ease-in-out infinite, slideUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  
  .animate-text {
    animation: fadeIn 1.5s ease-out;
  }

  .tracking-in {
    letter-spacing: 1px;
    animation: tracking 2s ease-out;
  }
  
  @keyframes pulseGlow {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 10px 25px rgba(37,99,235,0.4)); }
    50% { transform: scale(1.05); filter: drop-shadow(0 20px 45px rgba(37,99,235,0.7)); }
  }
  
  @keyframes slideUp {
    0% { opacity: 0; transform: translateY(40px) scale(0.9); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes tracking {
    from { letter-spacing: -3px; opacity: 0; }
    to { letter-spacing: 1px; opacity: 1; }
  }

  /* Loading Flow Spinner Override */
  .spinner-custom {
    width: 50px;
    height: 50px;
    border: 3px solid rgba(37, 99, 235, 0.1);
    border-bottom-color: var(--primary-color);
    border-radius: 50%;
    animation: rotation 1.2s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
  }

  @keyframes rotation {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>

<script>
  // Cinematic transition after exactly 3 seconds
  setTimeout(function() {
    const splash = document.getElementById('splash-overlay');
    if (splash) {
      splash.style.transition = 'opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
      splash.style.opacity = '0';
      setTimeout(function() {
        window.location.href = "{{ url_for('login_redirect') }}";
      }, 600);
    } else {
      window.location.href = "{{ url_for('login_redirect') }}";
    }
  }, 3000);
</script>
{% endblock %}
