{% extends "common/base.html" %}
{% block styles %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/user.css') }}">
{% endblock %}
{% block content %}
<div class="row">
  <div class="col-12 mb-4">
    <h3 class="fw-bold">{{ t('submit_feedback_title') }}</h3>
    <p class="text-secondary-color">Rate the resolution for ticket <span class="font-monospace text-primary fw-bold">{{ complaint.ticket_id }}</span>. Closing this ticket helps us maintain operational reviews.</p>
  </div>
</div>

<div class="row">
  <div class="col-lg-6">
    <div class="bento-cell">
      <form action="{{ url_for('complaint.feedback', complaint_id=complaint.id) }}" method="POST">
        
        <!-- Star rating click buttons -->
        <div class="mb-4">
          <label class="form-label-custom d-block">{{ t('rating_label') }}</label>
          <div class="rating-stars my-2" id="stars-wrapper">
            {% for i in range(1, 6) %}
              <button type="button" class="rating-star-btn star-trigger" data-value="{{ i }}">
                <i class="bi bi-star-fill"></i>
              </button>
            {% endfor %}
          </div>
          <input type="hidden" name="rating" id="rating-score" required>
        </div>

        <!-- Optional Comments -->
        <div class="mb-4">
          <label class="form-label-custom">{{ t('comments_label') }}</label>
          <textarea name="comments" class="form-control form-control-custom" rows="4" placeholder="Share your suggestions or complaints experience..."></textarea>
        </div>

        <!-- Submission Trigger -->
        <div class="d-flex justify-content-end gap-2">
          <a href="{{ url_for('complaint.details', complaint_id=complaint.id) }}" class="btn btn-outline-secondary px-4 py-2">Back</a>
          <button type="submit" id="feedback-submit" class="btn btn-success px-4 py-2 fw-semibold" disabled>
            {{ t('submit_feedback_btn') }}
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const stars = document.querySelectorAll('.star-trigger');
    const scoreField = document.getElementById('rating-score');
    const submitBtn = document.getElementById('feedback-submit');

    if (stars && scoreField && submitBtn) {
      stars.forEach(star => {
        star.addEventListener('click', function () {
          const ratingVal = parseInt(star.getAttribute('data-value'));
          scoreField.value = ratingVal;
          submitBtn.disabled = false;

          // Highlight stars
          stars.forEach(s => {
            const sVal = parseInt(s.getAttribute('data-value'));
            if (sVal <= ratingVal) {
              s.classList.add('active');
            } else {
              s.classList.remove('active');
            }
          });
        });
      });
    }
  });
</script>
{% endblock %}
