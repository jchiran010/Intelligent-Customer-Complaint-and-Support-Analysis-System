<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration - Support Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/user/css/user.css">
  <link rel="stylesheet" href="/user/css/user-responsive.css">
  <style>
    .register-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: radial-gradient(circle at 90% 10%, rgba(13, 148, 136, 0.08) 0%, rgba(2, 132, 199, 0.03) 90%);
    }
    .register-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      padding: 2.5rem 2.25rem;
    }
  </style>
</head>
<body>

  <div class="register-wrapper">
    <div class="register-card">
      <div class="text-center mb-4">
        <span class="badge bg-primary-subtle text-primary fw-bold text-uppercase mb-2">Customer Registration</span>
        <h3 class="fw-bold mb-1">Create Support Account</h3>
        <p class="text-muted small">Access full complaint tracking and customer support services</p>
      </div>

      <div id="registerAlert" class="alert alert-danger d-none" role="alert"></div>

      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Full Name</label>
          <input type="text" class="form-control" id="regName" placeholder="e.g. Alex Morgan" required>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold">Email Address</label>
          <input type="email" class="form-control" id="regEmail" placeholder="alex@domain.com" required>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Phone (Optional)</label>
            <input type="tel" class="form-control" id="regPhone" placeholder="+1-555-0199">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Department / Company</label>
            <input type="text" class="form-control" id="regDept" placeholder="e.g. Enterprise Client">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold">Password (min 6 characters)</label>
          <input type="password" class="form-control" id="regPassword" minlength="6" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btnRegisterSubmit">
          Create Customer Account
        </button>
      </form>

      <div class="mt-4 pt-3 border-top text-center">
        <span class="text-muted small">Already have an account?</span>
        <a href="/user/login.html" class="small fw-semibold text-decoration-none ms-1">Sign In &rarr;</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/user/js/user-common.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const department = document.getElementById('regDept').value.trim();
      const password = document.getElementById('regPassword').value;

      const alertBox = document.getElementById('registerAlert');
      const submitBtn = document.getElementById('btnRegisterSubmit');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Registering...';

      try {
        const res = await fetch('/api/user/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, department, password })
        });
        const data = await res.json();
        if (res.ok) {
          alertBox.className = 'alert alert-success d-block';
          alertBox.textContent = 'Account created successfully! Redirecting to login...';
          setTimeout(() => { window.location.href = '/user/login.html'; }, 1200);
        } else {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Customer Account';
          alertBox.className = 'alert alert-danger d-block';
          alertBox.textContent = data.message || 'Registration failed.';
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Customer Account';
        alertBox.className = 'alert alert-danger d-block';
        alertBox.textContent = 'Network error during registration.';
      }
    });
  </script>
</body>
</html>
